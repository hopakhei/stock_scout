name: Daily scan

on:
  schedule:
    # US market: premarket 12:00 UTC, post-close 21:30 UTC (Mon-Fri)
    - cron: "0 12 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}      # optional
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}  # optional
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}          # optional
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # only if llm.provider=anthropic
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: stock-scout run
      - name: Commit digest archive
        run: |
          git config user.name "stock-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digests/
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F-%H%M)"
          git push
