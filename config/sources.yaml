# All ingestion sources. Adding/removing a source is a config change, not a code change.
# tier: leading  = niche/professional venues, the actual signal
#       lagging  = mass venues, used as an exclusion signal (already-viral penalty)
#       action   = filings / actions by professionals (Phase 2)

reddit:
  lookback_hours: 36
  posts_per_subreddit: 100
  comments_per_post: 30
  subreddits:
    # -- leading --
    - {name: SecurityAnalysis, tier: leading, enabled: true}
    - {name: valueinvesting, tier: leading, enabled: true}
    - {name: UndervaluedStonks, tier: leading, enabled: true}
    - {name: Vitards, tier: leading, enabled: true}
    - {name: pennystocks, tier: leading, enabled: true}
    - {name: Biotechplays, tier: leading, enabled: true}
    - {name: SPACs, tier: leading, enabled: true}
    - {name: Shortsqueeze, tier: leading, enabled: true}
    # -- lagging (exclusion signal) --
    - {name: wallstreetbets, tier: lagging, enabled: true}
    - {name: stocks, tier: lagging, enabled: true}
    - {name: investing, tier: lagging, enabled: true}

apewisdom:
  enabled: true
  # used for: (a) mainstream/already-viral flag, (b) baseline warm start
  filter: all-stocks
  top_n_mainstream: 50

